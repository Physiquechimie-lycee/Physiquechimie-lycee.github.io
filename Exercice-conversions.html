<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Entraînement aux conversions d'unités | Physique-Chimie au lycée</title>

  <style>

    /* =========================================================
       IDENTITÉ VISUELLE
       ========================================================= */

    :root {
      --navy: #14273d;
      --navy-light: #1f3552;
      --gold: #b08d2b;
      --gold-light: #d0b35a;
      --cream: #faf9f5;
      --white: #ffffff;
      --ink: #232a35;
      --muted: #6b7280;
      --line: #e3ddd0;
      --soft: #f3f1eb;

      --shadow: 0 12px 30px rgba(20,39,61,0.10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;

      font-family: Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(176,141,43,0.08),
          transparent 35%
        ),
        var(--cream);

      line-height: 1.6;
      -webkit-text-size-adjust: 100%;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    h1,
    h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: normal;
      color: var(--navy);
    }


    /* =========================================================
       CARTE PRINCIPALE
       ========================================================= */

    .card {
      width: 100%;
      max-width: 500px;

      background: var(--white);

      padding: 30px 30px 28px;

      border: 1px solid var(--line);
      border-top: 4px solid var(--gold);

      box-shadow: var(--shadow);

      text-align: center;
    }

    h1 {
      font-size: 1.65rem;
      line-height: 1.25;
      margin: 0 0 8px;
    }


    /* =========================================================
       SÉRIE
       ========================================================= */

    .streak {
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 25px;
      font-size: 1rem;
    }

    .streak span {
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.2rem;
    }


    /* =========================================================
       QUESTION
       ========================================================= */

    .question {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.55rem;
      font-weight: normal;

      color: var(--navy);

      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(176,141,43,0.10),
          transparent 40%
        ),
        var(--cream);

      border: 1px solid var(--line);
      border-left: 4px solid var(--gold);

      padding: 18px 16px;

      margin-bottom: 23px;

      box-shadow: 0 5px 18px rgba(20,39,61,0.045);
    }


    /* =========================================================
       SAISIE
       ========================================================= */

    .input-group {
      display: flex;
      gap: 10px;

      align-items: center;
      justify-content: center;

      margin-bottom: 22px;

      flex-wrap: wrap;
    }

    input[type="text"] {
      font-family: Helvetica, Arial, sans-serif;

      font-size: 1.2rem;

      padding: 12px 13px;

      width: 150px;

      text-align: right;

      color: var(--ink);
      background: var(--white);

      border: 2px solid var(--line);

      border-radius: 6px;

      outline: none;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(176,141,43,0.12);
    }

    .unit {
      font-family: Georgia, "Times New Roman", serif;

      font-size: 1.25rem;
      font-weight: normal;

      color: var(--navy);
    }


    /* =========================================================
       BOUTONS
       ========================================================= */

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;

      padding: 13px 16px;

      font-family: Helvetica, Arial, sans-serif;

      font-size: 1rem;
      font-weight: bold;

      color: var(--navy);
      background: var(--gold);

      border: 1px solid var(--gold);

      border-radius: 5px;

      cursor: pointer;

      transition:
        background .2s ease,
        transform .15s ease,
        box-shadow .2s ease;
    }

    button:hover {
      background: var(--gold-light);
      border-color: var(--gold-light);

      transform: translateY(-1px);

      box-shadow: 0 5px 14px rgba(176,141,43,0.18);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    button.btn-help {
      color: var(--navy);

      background: var(--cream);

      border: 1px solid var(--line);

      font-size: 0.9rem;

      padding: 10px 14px;
    }

    button.btn-help:hover {
      background: var(--soft);
      border-color: var(--gold);
      box-shadow: none;
    }


    /* =========================================================
       FEEDBACK
       ========================================================= */

    .feedback {
      margin-top: 17px;

      font-weight: bold;

      min-height: 26px;

      font-size: 0.96rem;
    }

    .correct {
      color: #26734d;
    }

    .incorrect {
      color: #a33a3a;
    }


    /* =========================================================
       POPUPS MODALES
       ========================================================= */

    .modal {
      display: none;

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: rgba(20,39,61,0.62);

      justify-content: center;
      align-items: center;

      padding: 16px;

      z-index: 1000;
    }

    .modal-content {
      position: relative;

      background: var(--white);

      padding: 28px 26px 24px;

      border-top: 4px solid var(--gold);

      border: 1px solid var(--line);
      border-top-width: 4px;

      box-shadow: 0 18px 45px rgba(20,39,61,0.20);

      text-align: center;

      max-width: 430px;

      width: 100%;

      max-height: 90vh;

      overflow-y: auto;
    }

    .modal-content h2 {
      margin-top: 0;
      margin-bottom: 10px;

      font-size: 1.45rem;

      line-height: 1.3;
    }

    .modal-content p {
      color: var(--muted);
      margin-bottom: 5px;
    }

    .modal-content button {
      margin-top: 17px;
    }


    /* =========================================================
       TABLEAU DES PRÉFIXES
       ========================================================= */

    .prefix-table {
      width: 100%;

      border-collapse: collapse;

      margin-top: 15px;

      font-size: 0.92rem;

      border: 1px solid var(--line);
    }

    .prefix-table th,
    .prefix-table td {
      padding: 8px 6px;

      border-bottom: 1px solid var(--line);

      text-align: center;
    }

    .prefix-table th {
      background: var(--navy);

      color: var(--white);

      font-weight: bold;
    }

    .prefix-table tr:nth-child(even) {
      background: var(--cream);
    }

    .prefix-table tr:last-child td {
      border-bottom: none;
    }

    .prefix-table strong {
      color: var(--navy);
    }


    /* =========================================================
       SMARTPHONES
       ========================================================= */

    @media (max-width: 600px) {

      body {
        padding: 14px 10px;
        align-items: center;
      }

      .card {
        padding: 25px 20px 23px;

        border-top-width: 4px;
      }

      h1 {
        font-size: 1.48rem;
      }

      .streak {
        margin-bottom: 21px;
        font-size: 0.94rem;
      }

      .question {
        font-size: 1.38rem;

        padding: 17px 13px;

        margin-bottom: 21px;
      }

      .input-group {
        gap: 8px;
      }

      input[type="text"] {
        width: 145px;
        font-size: 1.12rem;
        padding: 11px 12px;
      }

      .unit {
        font-size: 1.18rem;
      }

      button {
        padding: 13px;
      }

      .modal-content {
        padding: 24px 18px 20px;
      }

      .prefix-table {
        font-size: 0.86rem;
      }

      .prefix-table th,
      .prefix-table td {
        padding: 7px 4px;
      }
    }


    /* =========================================================
       TRÈS PETITS SMARTPHONES
       ========================================================= */

    @media (max-width: 380px) {

      body {
        padding: 10px 7px;
      }

      .card {
        padding: 22px 16px 20px;
      }

      h1 {
        font-size: 1.4rem;
      }

      .question {
        font-size: 1.28rem;
      }

      input[type="text"] {
        width: 135px;
      }

      .prefix-table {
        font-size: 0.8rem;
      }
    }

  </style>

</head>

<body>

<div class="card">

  <h1>Conversions d'unités</h1>

  <div class="streak">
    Série de réussites :
    <span id="streak">0</span> / 10
  </div>

  <div class="question" id="question">
    Chargement...
  </div>

  <div class="input-group">

 
<input
  type="text"
  id="answer"
  placeholder="ex : 1.5e3"
  inputmode="decimal"
  autocomplete="off"
>

<span class="unit" id="target-unit">
  g
</span>
 

  </div>

  <div class="btn-group">

 
<button
  id="btn-submit"
  onclick="checkAnswer()">
  Valider
</button>

<button
  class="btn-help"
  onclick="openHelp()">
  Voir le tableau des préfixes
</button>
 

  </div>

  <div
    class="feedback"
    id="feedback">
  </div>

</div>

<!-- =========================================================
     MODAL RÉCOMPENSE
     ========================================================= -->

<div class="modal" id="modal-reward">

  <div class="modal-content">

 
<h2 id="modal-title">
  Bravo !
</h2>

<p id="modal-msg">
  Excellente progression !
</p>

<button onclick="closeModal('modal-reward')">
  Continuer
</button>
 

  </div>

</div>

<!-- =========================================================
     MODAL AIDE
     ========================================================= -->

<div class="modal" id="modal-help">

  <div class="modal-content">

 
<h2>
  Tableau des préfixes
</h2>

<table class="prefix-table">

  <thead>

    <tr>
      <th>Préfixe</th>
      <th>Symbole</th>
      <th>Puissance</th>
    </tr>

  </thead>

  <tbody>

    <tr>
      <td>Giga</td>
      <td><strong>G</strong></td>
      <td>10<sup>9</sup></td>
    </tr>

    <tr>
      <td>Méga</td>
      <td><strong>M</strong></td>
      <td>10<sup>6</sup></td>
    </tr>

    <tr>
      <td>kilo</td>
      <td><strong>k</strong></td>
      <td>10<sup>3</sup></td>
    </tr>

    <tr>
      <td>hecto</td>
      <td><strong>h</strong></td>
      <td>10<sup>2</sup></td>
    </tr>

    <tr>
      <td>déca</td>
      <td><strong>da</strong></td>
      <td>10<sup>1</sup></td>
    </tr>

    <tr>
      <td>(unité)</td>
      <td>—</td>
      <td>10<sup>0</sup> = 1</td>
    </tr>

    <tr>
      <td>déci</td>
      <td><strong>d</strong></td>
      <td>10<sup>-1</sup></td>
    </tr>

    <tr>
      <td>centi</td>
      <td><strong>c</strong></td>
      <td>10<sup>-2</sup></td>
    </tr>

    <tr>
      <td>milli</td>
      <td><strong>m</strong></td>
      <td>10<sup>-3</sup></td>
    </tr>

    <tr>
      <td>micro</td>
      <td><strong>µ</strong></td>
      <td>10<sup>-6</sup></td>
    </tr>

    <tr>
      <td>nano</td>
      <td><strong>n</strong></td>
      <td>10<sup>-9</sup></td>
    </tr>

  </tbody>

</table>

<button onclick="closeModal('modal-help')">
  Fermer
</button>
 

  </div>

</div>

<script>

  const units = ['g', 'm', 'L', 'V', 'A', 'N'];

  const prefixes = [
    { symbol: 'n', exp: -9 },
    { symbol: 'µ', exp: -6 },
    { symbol: 'm', exp: -3 },
    { symbol: 'c', exp: -2 },
    { symbol: 'd', exp: -1 },
    { symbol: '',  exp: 0 },
    { symbol: 'da', exp: 1 },
    { symbol: 'h', exp: 2 },
    { symbol: 'k', exp: 3 },
    { symbol: 'M', exp: 6 },
    { symbol: 'G', exp: 9 }
  ];

  let streak = 0;
  let currentTargetValue = 0;


  function getRandom(min, max) {
    return Math.floor(
      Math.random() * (max - min + 1)
    ) + min;
  }


  function generateQuestion() {

    const unit =
      units[getRandom(0, units.length - 1)];

    let srcIndex =
      getRandom(0, prefixes.length - 1);

    let targetIndex =
      getRandom(0, prefixes.length - 1);

    while (targetIndex === srcIndex) {

      targetIndex =
        getRandom(0, prefixes.length - 1);
    }

    const srcPrefix = prefixes[srcIndex];
    const targetPrefix = prefixes[targetIndex];

    const baseValue =
      getRandom(10, 999) / 10;

    const expDiff =
      srcPrefix.exp - targetPrefix.exp;

    currentTargetValue =
      baseValue * Math.pow(10, expDiff);

    document.getElementById('question').innerText =
      `${baseValue} ${srcPrefix.symbol}${unit} = ?`;

    document.getElementById('target-unit').innerText =
      `${targetPrefix.symbol}${unit}`;

    const input =
      document.getElementById('answer');

    input.value = '';

    input.focus();

    document.getElementById('feedback').innerText = '';

  }


  function parseInput(val) {

    if (!val) return NaN;

    let clean =
      val
        .trim()
        .replace(',', '.')
        .replace(/10\^/i, 'e')
        .replace(/\*10\^/i, 'e');

    return parseFloat(clean);
  }


  function checkAnswer() {

    const inputVal =
      document.getElementById('answer').value;

    const userVal =
      parseInput(inputVal);

    if (isNaN(userVal)) {

      document.getElementById('feedback').innerText =
        "Saisie invalide (ex : 1.5e3 ou 1500)";

      document.getElementById('feedback').className =
        "feedback incorrect";

      return;
    }


    const relativeError =
      Math.abs(
        (userVal - currentTargetValue) /
        currentTargetValue
      );


    if (relativeError < 0.001) {

      streak++;

      document.getElementById('streak').innerText =
        streak;

      document.getElementById('feedback').innerText =
        "Bonne réponse !";

      document.getElementById('feedback').className =
        "feedback correct";


      if (streak === 5) {

        showModal(
          "modal-reward",
          "Super cap !",
          "Tu as aligné 5 bonnes réponses d'affilée ! Plus que 5 pour la victoire."
        );

      }

      else if (streak === 10) {

        showModal(
          "modal-reward",
          "Victoire !",
          "Parfait ! 10 bonnes réponses consécutives. Tu maîtrises les conversions !"
        );

        streak = 0;

        document.getElementById('streak').innerText =
          streak;

      }

      else {

        setTimeout(
          generateQuestion,
          1000
        );

      }

    }

    else {

      streak = 0;

      document.getElementById('streak').innerText =
        streak;

      document.getElementById('feedback').innerText =
        `Dommage ! La réponse était ${currentTargetValue.toPrecision(4)}`;

      document.getElementById('feedback').className =
        "feedback incorrect";

      setTimeout(
        generateQuestion,
        2500
      );

    }

  }


  function showModal(id, title, msg) {

    if (title) {
      document.getElementById('modal-title').innerText =
        title;
    }

    if (msg) {
      document.getElementById('modal-msg').innerText =
        msg;
    }

    document.getElementById(id).style.display =
      'flex';
  }


  function openHelp() {
    showModal('modal-help');
  }


  function closeModal(id) {

    document.getElementById(id).style.display =
      'none';

    if (id === 'modal-reward') {
      generateQuestion();
    }

  }


  document
    .getElementById('answer')
    .addEventListener(
      'keypress',
      function(e) {

        if (e.key === 'Enter') {
          checkAnswer();
        }

      }
    );


  generateQuestion();

</script>

</body>
</html>
